<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Billare – Juego de Billar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
      font-size: 2.2em;
    }

    p {
      line-height: 1.6;
      opacity: 0.9;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background-color: #00c853;
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button:hover {
      background-color: #00a844;
    }

    .links {
      margin-top: 24px;
      font-size: 0.9em;
    }

    .links a {
      color: #90caf9;
      text-decoration: none;
      margin: 0 8px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Billare</h1>

    <p>
      Billare es un juego de billar sencillo y entretenido,
      diseñado para disfrutar partidas rápidas en tu dispositivo Android.
    </p>

    <a class="button" href="https://play.google.com/store/apps/details?id=com.arcade.jugomaiz&hl=en-US" target="_blank">
      Ver en Google Play
    </a>

    <div class="links">
      <a href="privacy-policy.html">Política de privacidad</a>
      ·
      <a href="vikovitc@gmail.com">Contacto</a>
    </div>
  </div>
</body>
</html>
